  # Site Hermes layers live in public shanemcd/toolbox (openshell-kubevirt/);
  # images still publish to ghcr.io/${{ github.repository_owner }}.
  build-hermes-site:
    needs: [meta, build-hermes-minimal-bootc]
    if: |
      always() &&
      !cancelled() &&
      needs.meta.outputs.build_site_hermes == 'true' &&
      needs.build-hermes-minimal-bootc.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      image_ref: ${{ steps.capture.outputs.image_ref }}
      image_digest: ${{ steps.capture.outputs.image_digest }}
    env:
      BOOTC_IMAGE: ghcr.io/${{ github.repository_owner }}/hermes-site-bootc
      DISK_IMAGE: ghcr.io/${{ github.repository_owner }}/hermes-site-kubevirt
      BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/hermes-minimal-bootc:nightly
    steps:
      - name: Checkout toolbox site layers
        uses: actions/checkout@v4
        with:
          # No andyettanotherorg/toolbox fork yet; site sources stay on public shanemcd/toolbox.
          repository: shanemcd/toolbox
          path: toolbox

      - uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push hermes-site-bootc
        working-directory: toolbox/openshell-kubevirt
        env:
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform=linux/amd64 \
            --push \
            --cache-from type=gha,scope=hermes-site-bootc \
            --cache-to type=gha,mode=max,scope=hermes-site-bootc \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            -t "${BOOTC_IMAGE}:latest" \
            -t "${BOOTC_IMAGE}:${DATE}" \
            -t "${BOOTC_IMAGE}:nightly" \
            -f Containerfile .

      # bib needs ~tens of GB; site job already pulled minimal + layered images.
      - name: Free disk space before bootc-image-builder
        run: |
          set -euo pipefail
          df -h
          docker buildx prune -af || true
          docker system prune -af --volumes || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h

      - name: Login rootful podman to GHCR
        run: |
          set -euo pipefail
          echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build qcow2 with bootc-image-builder
        id: bib
        uses: osbuild/bootc-image-builder-action@v0.0.2
        with:
          config-file: ${{ github.workspace }}/toolbox/openshell-kubevirt/bib-qcow2.toml
          image: ${{ env.BOOTC_IMAGE }}:nightly
          types: qcow2
          rootfs: ext4
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          additional-args: --use-librepo=True

      - name: Package and push hermes-site-kubevirt
        working-directory: toolbox/openshell-kubevirt
        env:
          DATE: ${{ needs.meta.outputs.date }}
          QCOW2: ${{ steps.bib.outputs.qcow2-output-path }}
        run: |
          set -euo pipefail
          test -n "$QCOW2"
          test -f "$QCOW2"

          PKG=$(mktemp -d)
          mkdir -p "$PKG/disk"
          cp "$QCOW2" "$PKG/disk/fedora.qcow2"
          cp Containerfile.disk "$PKG/Dockerfile"

          docker buildx build \
            --platform=linux/amd64 \
            --push \
            -t "${DISK_IMAGE}:latest" \
            -t "${DISK_IMAGE}:${DATE}" \
            -t "${DISK_IMAGE}:nightly" \
            "$PKG"

      - name: Capture image digest
        id: capture
        if: always()
        env:
          IMAGE: "${{ env.DISK_IMAGE }}"
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          set -euo pipefail
          CRANE_BIN="$(mktemp -d)/crane"
          curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/crane_linux_amd64" -o "$CRANE_BIN"
          chmod +x "$CRANE_BIN"
          DIGEST="" 
          for tag in "${DATE}" nightly; do
            DIGEST=$($CRANE_BIN digest "${IMAGE}:${tag}" 2>/dev/null) || true
            if [[ -n "$DIGEST" ]]; then
              break
            fi
          done
          if [[ -z "${DIGEST:-}" ]]; then
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:nightly" \

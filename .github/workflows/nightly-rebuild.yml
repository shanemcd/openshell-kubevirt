  # ---------------------------------------------------------------------------
  # Report build metadata — prints a table of all produced images and uploads
  # a JSON artifact with the full metadata for downstream consumption.
  # ---------------------------------------------------------------------------
  # Upstream ships openshell-cli as GitHub release assets only; this fork's
  # sandbox egress policy blocks the asset CDN, so the watchdog provisions the
  # CLI from this artifact instead. Built from the same rebase SHA as the
  # gateway so client and server schema always match (single source: rebase-openshell.outputs.sha).
  build-openshell-cli:
    needs: [meta, rebases, rebase-openshell]
    if: needs.meta.outputs.push_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OpenShell
          ref: ${{ needs.rebase-openshell.outputs.sha }}
          path: src
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          working_directory: src
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: openshell-cli
          prefix-key: v1-cli
          cache-on-failure: true

      - name: Build openshell CLI (release, gnu static like gateway)
        working-directory: src
        id: build
        env:
          SHA: ${{ needs.rebase-openshell.outputs.sha }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"
          mise install --locked
          cargo build --release -p openshell-cli
          BIN="$(cargo metadata --format-version 1 | python3 -c 'import json,sys; m=json.load(sys.stdin); pkg=next(p for p in m["packages"] if p["name"]=="openshell-cli"); print(next(t["name"] for t in pkg["targets"] if "bin" in t["kind"]))')"
          SRC="target/release/${BIN}"
          test -x "$SRC"
          STAGE="dist"
          mkdir -p "$STAGE"
          tar -C "$(dirname "$SRC")" -czf "$STAGE/openshell-cli-linux-x86_64.tar.gz" "$BIN"
          ( cd "$STAGE" && sha256sum "openshell-cli-linux-x86_64.tar.gz" > openshell-cli-checksums-sha256.txt )
          echo "sha=${SHORT}" >> "$GITHUB_OUTPUT"
          ls -la "$STAGE"

      - uses: actions/upload-artifact@v4
        working-directory: src   # build step wrote src/dist; default cwd is workspace root
        with:
          name: openshell-cli
          # single directory scalar: multi-line path blocks have been shown to
          # collapse into one bogus pattern and upload NOTHING as a warning-only
          # no-op. if-no-files-found turns that class of failure into a hard red.
          path: dist
          if-no-files-found: error
          retention-days: 30

  report-build-metadata:
    needs:
      - meta
      - build-agent-sandbox
      - build-openshell-gateway
      - build-openshell-supervisor
      - build-nemoclaw-hermes
      - build-hermes-bootc
      - build-hermes-minimal-bootc
      - build-hermes-containerdisk
      - build-hermes-minimal-containerdisk
      - build-hermes-site
      - build-openshell-cli
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
    steps:
      - name: Print build summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          echo "## Build Report — ${{ github.workflow }} (run ${{ github.run_number }})"
          echo "Run: ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Date: $DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch/Tag: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          printf "| Image | Digest |" >> "$GITHUB_STEP_SUMMARY"
          printf "\n|-------|--------|" >> "$GITHUB_STEP_SUMMARY"

          print_image() {
            local label="$1"
            local ref="$2"
            if [[ -n "$ref" && "$ref" != "" ]]; then
              printf "\n| %s | \`%s\` |" "$label" "$ref" >> "$GITHUB_STEP_SUMMARY"
            else
              printf "\n| %s | _(not built or unavailable)_ |" "$label" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          print_image "agent-sandbox-controller"  "${{ needs.build-agent-sandbox.outputs.image_ref }}"
          print_image "openshell-gateway"        "${{ needs.build-openshell-gateway.outputs.image_ref }}"
          print_image "openshell-supervisor"     "${{ needs.build-openshell-supervisor.outputs.image_ref }}"
          print_image "nemoclaw-hermes"          "${{ needs.build-nemoclaw-hermes.outputs.image_ref }}"
          print_image "hermes-sandbox-bootc"     "${{ needs.build-hermes-bootc.outputs.image_ref }}"
          print_image "hermes-minimal-bootc"     "${{ needs.build-hermes-minimal-bootc.outputs.image_ref }}"
          print_image "hermes-sandbox-kubevirt"  "${{ needs.build-hermes-containerdisk.outputs.image_ref }}"
          print_image "hermes-minimal-kubevirt"  "${{ needs.build-hermes-minimal-containerdisk.outputs.image_ref }}"
          print_image "hermes-site-kubevirt"     "${{ needs.build-hermes-site.outputs.image_ref }}"
          printf "\n| openshell-cli | artifact \`openshell-cli\` (tar.gz + sha256) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Build manifest JSON
        id: manifest
        env:
          DATE: ${{ needs.meta.outputs.date }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Helper: wrap a value as a JSON string (empty → null in JSON).
          json_str() {
            if [[ -n "${1:-}" ]]; then
              printf '"%s"' "$1"
            else
              printf 'null'
            fi
          }

          cat <<JSONEOF > manifest.json
          {
            "run": {
              "url": "${RUN_URL}",
              "number": ${RUN_NUM},
              "sha": "${SHA}",
              "ref": "${REF}",
              "date": "${DATE}",
              "repository": "${REPO}"
            },
            "images": {
              "agent-sandbox-controller": {
                "image": "ghcr.io/${{ github.repository_owner }}/agent-sandbox-controller",
                "digest": $(json_str "${{ needs.build-agent-sandbox.outputs.image_digest }}"),
                "ref": $(json_str "${{ needs.build-agent-sandbox.outputs.image_ref }}")
              },
              "openshell-gateway": {
                "image": "ghcr.io/${{ github.repository_owner }}/openshell-gateway",
                "digest": $(json_str "${{ needs.build-openshell-gateway.outputs.image_digest }}"),
                "ref": $(json_str "${{ needs.build-openshell-gateway.outputs.image_ref }}")
              },
              "openshell-supervisor": {
                "image": "ghcr.io/${{ github.repository_owner }}/openshell-supervisor",
                "digest": $(json_str "${{ needs.build-openshell-supervisor.outputs.image_digest }}"),
                "ref": $(json_str "${{ needs.build-openshell-supervisor.outputs.image_ref }}")
              },
              "nemoclaw-hermes": {
                "image": "ghcr.io/${{ github.repository_owner }}/nemoclaw-hermes",
                "digest": $(json_str "${{ needs.build-nemoclaw-hermes.outputs.image_digest }}"),
                "ref": $(json_str "${{ needs.build-nemoclaw-hermes.outputs.image_ref }}")
              },
              "hermes-sandbox-bootc": {
                "image": "ghcr.io/${{ github.repository_owner }}/hermes-sandbox-bootc",
                "digest": $(json_str "${{ needs.build-hermes-bootc.outputs.image_digest }}"),
                "ref": $(json_str "${{ needs.build-hermes-bootc.outputs.image_ref }}")
              },
              "hermes-minimal-bootc": {
                "image": "ghcr.io/${{ github.repository_owner }}/hermes-minimal-bootc",
                "digest": $(json_str "${{ needs.build-hermes-minimal-bootc.outputs.image_digest }}"),
                "ref": $(json_str "${{ needs.build-hermes-minimal-bootc.outputs.image_ref }}")
              },
              "hermes-sandbox-kubevirt": {
                "image": "ghcr.io/${{ github.repository_owner }}/hermes-sandbox-kubevirt",
                "digest": $(json_str "${{ needs.build-hermes-containerdisk.outputs.image_digest }}"),
                "ref": $(json_str "${{ needs.build-hermes-containerdisk.outputs.image_ref }}")
              },
              "hermes-minimal-kubevirt": {
                "image": "ghcr.io/${{ github.repository_owner }}/hermes-minimal-kubevirt",
                "digest": $(json_str "${{ needs.build-hermes-minimal-containerdisk.outputs.image_digest }}"),
                "ref": $(json_str "${{ needs.build-hermes-minimal-containerdisk.outputs.image_ref }}")
              },
              "hermes-site-kubevirt": {
                "image": "ghcr.io/${{ github.repository_owner }}/hermes-site-kubevirt",
                "digest": $(json_str "${{ needs.build-hermes-site.outputs.image_digest }}"),
                "ref": $(json_str "${{ needs.build-hermes-site.outputs.image_ref }}")
              }
            }
          }
          JSONEOF

          # Pretty-print for the summary table
          cat manifest.json

          # Store as workflow output for downstream jobs (if any)
          MANIFEST=$(cat manifest.json | tr -d '\n' | sed 's/"/\\"/g')
          echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: manifest.json
          retention-days: 30

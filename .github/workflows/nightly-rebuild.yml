name: Nightly rebase and rebuild

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC
  workflow_dispatch:
    inputs:
      rebase:
        description: Rebase forks onto upstream and force-push when clean
        type: boolean
        default: true
      push_images:
        description: Build and push images to GHCR
        type: boolean
        default: true
      build_container_disk:
        description: Convert hermes-sandbox-bootc + hermes-minimal-bootc to containerDisk images
        type: boolean
        default: true
      build_hermes:
        description: Rebuild hermes-sandbox-bootc (nemoclaw variant; uses GHCR supervisor + nemoclaw-hermes)
        type: boolean
        default: false
      build_hermes_minimal:
        description: Rebuild hermes-minimal-bootc (no NemoClaw; uses GHCR supervisor)
        type: boolean
        default: false
      build_site_hermes:
        description: Layer toolbox openshell-kubevirt/ onto hermes-minimal bootc → hermes-site-bootc + hermes-site-kubevirt
        type: boolean
        default: true

concurrency:
  group: nightly-rebuild
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # type=gha BuildKit cache + rust-cache / mise-action write Actions cache entries.
  actions: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.meta.outputs.date }}
      rebase: ${{ steps.meta.outputs.rebase }}
      push_images: ${{ steps.meta.outputs.push_images }}
      build_container_disk: ${{ steps.meta.outputs.build_container_disk }}
      build_hermes: ${{ steps.meta.outputs.build_hermes }}
      build_hermes_minimal: ${{ steps.meta.outputs.build_hermes_minimal }}
      build_site_hermes: ${{ steps.meta.outputs.build_site_hermes }}
    steps:
      - id: meta
        run: |
          set -euo pipefail
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "rebase=${{ inputs.rebase }}" >> "$GITHUB_OUTPUT"
            echo "push_images=${{ inputs.push_images }}" >> "$GITHUB_OUTPUT"
            echo "build_container_disk=${{ inputs.build_container_disk }}" >> "$GITHUB_OUTPUT"
            echo "build_hermes=${{ inputs.build_hermes }}" >> "$GITHUB_OUTPUT"
            echo "build_hermes_minimal=${{ inputs.build_hermes_minimal }}" >> "$GITHUB_OUTPUT"
            echo "build_site_hermes=${{ inputs.build_site_hermes }}" >> "$GITHUB_OUTPUT"
          else
            echo "rebase=true" >> "$GITHUB_OUTPUT"
            echo "push_images=true" >> "$GITHUB_OUTPUT"
            echo "build_container_disk=true" >> "$GITHUB_OUTPUT"
            echo "build_hermes=false" >> "$GITHUB_OUTPUT"
            echo "build_hermes_minimal=false" >> "$GITHUB_OUTPUT"
            echo "build_site_hermes=true" >> "$GITHUB_OUTPUT"
          fi

  rebase-agent-sandbox:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.rebase.outputs.sha }}
    steps:
      # App token only needed to force-push the feature branch. Public checkout
      # with github.token is enough when rebase=false (image bake / proof runs).
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: needs.meta.outputs.rebase == 'true'
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agent-sandbox

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agent-sandbox
          ref: kubevirt-backend
          token: ${{ needs.meta.outputs.rebase == 'true' && steps.app-token.outputs.token || github.token }}
          fetch-depth: 0
          path: src

      - id: rebase
        working-directory: src
        env:
          SHOULD_REBASE: ${{ needs.meta.outputs.rebase }}
        run: |
          set -euo pipefail
          git config user.name "openshell-kubevirt-rebase[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kubernetes-sigs/agent-sandbox.git
          git fetch upstream main
          if [[ "$SHOULD_REBASE" == "true" ]]; then
            if ! git rebase upstream/main; then
              echo "::error::Rebase conflict on agent-sandbox kubevirt-backend"
              git status
              git rebase --abort || true
              exit 1
            fi
            if ! git push --force-with-lease origin kubevirt-backend 2>push.err; then
              cat push.err >&2
              if grep -qiE 'workflows permission|without .workflows. permission' push.err; then
                echo "::error::GitHub App cannot push .github/workflows changes. Grant the App Workflows: Read and write, accept it on installed repos, then re-run."
              fi
              exit 1
            fi
          else
            echo "Skipping rebase/push (rebase=false)"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  rebase-openshell:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.rebase.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: needs.meta.outputs.rebase == 'true'
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: OpenShell

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OpenShell
          ref: vm-runtime-backend
          token: ${{ needs.meta.outputs.rebase == 'true' && steps.app-token.outputs.token || github.token }}
          fetch-depth: 0
          path: src

      - id: rebase
        working-directory: src
        env:
          SHOULD_REBASE: ${{ needs.meta.outputs.rebase }}
        run: |
          set -euo pipefail
          git config user.name "openshell-kubevirt-rebase[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NVIDIA/OpenShell.git
          git fetch upstream main
          if [[ "$SHOULD_REBASE" == "true" ]]; then
            if ! git rebase upstream/main; then
              echo "::error::Rebase conflict on OpenShell vm-runtime-backend"
              git status
              git rebase --abort || true
              exit 1
            fi
            if ! git push --force-with-lease origin vm-runtime-backend 2>push.err; then
              cat push.err >&2
              if grep -qiE 'workflows permission|without .workflows. permission' push.err; then
                echo "::error::GitHub App cannot push .github/workflows changes. Grant the App Workflows: Read and write, accept it on installed repos, then re-run."
              fi
              exit 1
            fi
          else
            echo "Skipping rebase/push (rebase=false)"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  rebase-nemoclaw:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.rebase.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: needs.meta.outputs.rebase == 'true'
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: NemoClaw

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/NemoClaw
          ref: vm-runtime-backend
          token: ${{ needs.meta.outputs.rebase == 'true' && steps.app-token.outputs.token || github.token }}
          fetch-depth: 0
          path: src

      - id: rebase
        working-directory: src
        env:
          SHOULD_REBASE: ${{ needs.meta.outputs.rebase }}
        run: |
          set -euo pipefail
          git config user.name "openshell-kubevirt-rebase[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NVIDIA/NemoClaw.git
          git fetch upstream main
          if [[ "$SHOULD_REBASE" == "true" ]]; then
            if ! git rebase upstream/main; then
              echo "::error::Rebase conflict on NemoClaw vm-runtime-backend"
              git status
              git rebase --abort || true
              exit 1
            fi
            if ! git push --force-with-lease origin vm-runtime-backend 2>push.err; then
              cat push.err >&2
              if grep -qiE 'workflows permission|without .workflows. permission' push.err; then
                echo "::error::GitHub App cannot push .github/workflows changes. Grant the App Workflows: Read and write, accept it on installed repos, then re-run."
              fi
              exit 1
            fi
          else
            echo "Skipping rebase/push (rebase=false)"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Gate: do not start image builds until every fork rebase/push succeeded.
  rebases:
    needs: [rebase-agent-sandbox, rebase-openshell, rebase-nemoclaw]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require all rebases succeeded
        env:
          AGENT: ${{ needs.rebase-agent-sandbox.result }}
          OPENSHELL: ${{ needs.rebase-openshell.result }}
          NEMOCLAW: ${{ needs.rebase-nemoclaw.result }}
        run: |
          set -euo pipefail
          echo "agent-sandbox=${AGENT} openshell=${OPENSHELL} nemoclaw=${NEMOCLAW}"
          if [[ "$AGENT" != success || "$OPENSHELL" != success || "$NEMOCLAW" != success ]]; then
            echo "::error::One or more fork rebases failed; skipping image builds."
            exit 1
          fi

  build-agent-sandbox:
    needs: [meta, rebases, rebase-agent-sandbox]
    if: needs.meta.outputs.push_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_ref: ${{ steps.capture.outputs.image_ref }}
      image_digest: ${{ steps.capture.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agent-sandbox
          ref: ${{ needs.rebase-agent-sandbox.outputs.sha }}
          path: src

      # Go compile lives inside the Dockerfile; BuildKit GHA cache keeps go mod
      # download + compile layers across nightly runs.
      - uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller
        working-directory: src
        id: build
        env:
          DATE: ${{ needs.meta.outputs.date }}
          SHA: ${{ needs.rebase-agent-sandbox.outputs.sha }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"
          IMAGE="${REGISTRY}/agent-sandbox-controller"
          GIT_VERSION=$(git describe --always --dirty 2>/dev/null || echo "$SHORT")
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          docker buildx build \
            --platform=linux/amd64 \
            --push \
            --cache-from type=gha,scope=agent-sandbox-controller \
            --cache-to type=gha,mode=max,scope=agent-sandbox-controller \
            -t "${IMAGE}:nightly" \
            -t "${IMAGE}:${DATE}" \
            -t "${IMAGE}:sha-${SHORT}" \
            --build-arg "GIT_VERSION=${GIT_VERSION}" \
            --build-arg "GIT_SHA=${SHORT}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            -f Dockerfile \
            .

      - name: Capture image digest
        id: capture
        if: always()
        env:
          IMAGE: "${{ env.REGISTRY }}/agent-sandbox-controller"
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          set -euo pipefail
          # Download crane if not present — works on both single-arch and
          # manifest-list images, unlike docker buildx imagetools inspect.
          CRANE_BIN="$(mktemp -d)/crane"
          curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/crane_linux_amd64" -o "$CRANE_BIN"
          chmod +x "$CRANE_BIN"
          DIGEST="" 
          for tag in "${DATE}" nightly; do
            DIGEST=$($CRANE_BIN digest "${IMAGE}:${tag}" 2>/dev/null) || true
            if [[ -n "$DIGEST" ]]; then
              break
            fi
          done
          # Fallback: manifest-list images may still have a Digest: line.
          if [[ -z "${DIGEST:-}" ]]; then
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:nightly" \
              2>/dev/null | awk '/^Digest:/ { print $2; exit }') || true
          fi
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          if [[ -n "${DIGEST:-}" ]]; then
            echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=${IMAGE}:nightly" >> "$GITHUB_OUTPUT"
          fi

  build-openshell-gateway:
    needs: [meta, rebases, rebase-openshell]
    if: needs.meta.outputs.push_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image_ref: ${{ steps.capture.outputs.image_ref }}
      image_digest: ${{ steps.capture.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OpenShell
          ref: ${{ needs.rebase-openshell.outputs.sha }}
          path: src
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rust builds on the runner (stage-prebuilt-binaries), then a thin image.
      - uses: jdx/mise-action@v2
        with:
          working_directory: src
          cache: true

      # Separate shared-key from supervisor (gnu.2.28 vs musl). Bump prefix-key
      # when the restored entry is "up-to-date" but yields 0 Fresh compiles (stuck
      # registry-only cache that never re-saves target/).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: openshell-gateway
          prefix-key: v2-rust
          cache-on-failure: true

      - name: Stage gateway binary and push image
        working-directory: src
        id: build
        env:
          DATE: ${{ needs.meta.outputs.date }}
          SHA: ${{ needs.rebase-openshell.outputs.sha }}
          DOCKER_PLATFORM: linux/amd64
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"
          TAG="sha-${SHORT}"
          mise install --locked
          DOCKER_PLATFORM=linux/amd64 tasks/scripts/stage-prebuilt-binaries.sh gateway
          # Script maps IMAGE_REGISTRY + openshell/gateway → ${REGISTRY}/gateway
          # OpenShell disables local BuildKit cache when CI=1; pass GHA scopes via extra args.
          # OpenShell prefers podman when present; GHA cache (type=gha) needs docker buildx.
          IMAGE_REGISTRY="${REGISTRY}" \
          IMAGE_TAG="${TAG}" \
          DOCKER_PLATFORM=linux/amd64 \
          DOCKER_PUSH=1 \
          CI=1 \
          CONTAINER_ENGINE=docker \
            tasks/scripts/docker-build-image.sh gateway \
              --cache-from type=gha,scope=openshell-gateway \
              --cache-to type=gha,mode=max,scope=openshell-gateway
          SRC="${REGISTRY}/gateway:${TAG}"
          for t in nightly "${DATE}" "${TAG}"; do
            docker buildx imagetools create \
              -t "${REGISTRY}/openshell-gateway:${t}" \
              "$SRC"
          done

      - name: Capture image digest
        id: capture
        if: always()
        env:
          IMAGE: "${{ env.REGISTRY }}/openshell-gateway"
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          set -euo pipefail
          CRANE_BIN="$(mktemp -d)/crane"
          curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/crane_linux_amd64" -o "$CRANE_BIN"
          chmod +x "$CRANE_BIN"
          DIGEST="" 
          for tag in "${DATE}" nightly; do
            DIGEST=$($CRANE_BIN digest "${IMAGE}:${tag}" 2>/dev/null) || true
            if [[ -n "$DIGEST" ]]; then
              break
            fi
          done
          if [[ -z "${DIGEST:-}" ]]; then
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:nightly" \
              2>/dev/null | awk '/^Digest:/ { print $2; exit }') || true
          fi
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          if [[ -n "${DIGEST:-}" ]]; then
            echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=${IMAGE}:nightly" >> "$GITHUB_OUTPUT"
          fi

  build-openshell-supervisor:
    needs: [meta, rebases, rebase-openshell]
    if: needs.meta.outputs.push_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_ref: ${{ steps.capture.outputs.image_ref }}
      image_digest: ${{ steps.capture.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OpenShell
          ref: ${{ needs.rebase-openshell.outputs.sha }}
          path: src
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: jdx/mise-action@v2
        with:
          working_directory: src
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          shared-key: openshell-supervisor
          prefix-key: v1-rust
          cache-on-failure: true

      - name: Stage supervisor binary and push image
        working-directory: src
        id: build
        env:
          DATE: ${{ needs.meta.outputs.date }}
          SHA: ${{ needs.rebase-openshell.outputs.sha }}
          DOCKER_PLATFORM: linux/amd64
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"
          TAG="sha-${SHORT}"
          mise install --locked
          DOCKER_PLATFORM=linux/amd64 tasks/scripts/stage-prebuilt-binaries.sh supervisor
          # OpenShell prefers podman when present; GHA cache (type=gha) needs docker buildx.
          IMAGE_REGISTRY="${REGISTRY}" \
          IMAGE_TAG="${TAG}" \
          DOCKER_PLATFORM=linux/amd64 \
          DOCKER_PUSH=1 \
          CI=1 \
          CONTAINER_ENGINE=docker \
            tasks/scripts/docker-build-image.sh supervisor \
              --cache-from type=gha,scope=openshell-supervisor \
              --cache-to type=gha,mode=max,scope=openshell-supervisor
          SRC="${REGISTRY}/supervisor:${TAG}"
          for t in nightly "${DATE}" "${TAG}" kubevirt; do
            docker buildx imagetools create \
              -t "${REGISTRY}/openshell-supervisor:${t}" \
              "$SRC"
          done

      - name: Capture image digest
        id: capture
        if: always()
        env:
          IMAGE: "${{ env.REGISTRY }}/openshell-supervisor"
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          set -euo pipefail
          CRANE_BIN="$(mktemp -d)/crane"
          curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/crane_linux_amd64" -o "$CRANE_BIN"
          chmod +x "$CRANE_BIN"
          DIGEST="" 
          for tag in "${DATE}" nightly kubevirt; do
            DIGEST=$($CRANE_BIN digest "${IMAGE}:${tag}" 2>/dev/null) || true
            if [[ -n "$DIGEST" ]]; then
              break
            fi
          done
          if [[ -z "${DIGEST:-}" ]]; then
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:kubevirt" \
              2>/dev/null | awk '/^Digest:/ { print $2; exit }') || true
          fi
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          if [[ -n "${DIGEST:-}" ]]; then
            echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=${IMAGE}:kubevirt" >> "$GITHUB_OUTPUT"
          fi

  build-nemoclaw-hermes:
    needs: [meta, rebases, rebase-nemoclaw]
    # PARKED 2026-09-11 (Shane: 'more trouble than it's worth').
    # Sole producer of the nemoclaw hermes-sandbox-bootc image. Its Dockerfile
    # integrity gate is red: agents/hermes/Dockerfile ~L470 does `sha256sum -c`
    # over image-build-probes.py against
    # NEMOCLAW_HERMES_IMAGE_BUILD_PROBES_SHA256=7c74c3f... and the file's current
    # content no longer matches. Re-pinning that checksum to force green is
    # exactly what watchdog rule 4 forbids unattended. No nightly cluster
    # workload consumes this image; its only consumer is build-hermes-bootc,
    # which stays gated on this job's result (see build_hermes guard note below).
    # TO RE-ENABLE: restore
    #   if: needs.meta.outputs.push_images == 'true'
    # after confirming the probes-file change is expected and re-pinning
    # NEMOCLAW_HERMES_IMAGE_BUILD_PROBES_SHA256 in NemoClaw.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_ref: ${{ steps.capture.outputs.image_ref }}
      image_digest: ${{ steps.capture.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/NemoClaw
          ref: ${{ needs.rebase-nemoclaw.outputs.sha }}
          path: src

      - uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nemoclaw-hermes
        working-directory: src
        id: build
        env:
          DATE: ${{ needs.meta.outputs.date }}
          SHA: ${{ needs.rebase-nemoclaw.outputs.sha }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"
          IMAGE="${REGISTRY}/nemoclaw-hermes"
          # Do not override BASE_IMAGE with :latest — NVIDIA's public tag is
          # missing/403; agents/hermes/Dockerfile pins a digest by default.
          docker buildx build \
            --platform=linux/amd64 \
            --push \
            --cache-from type=gha,scope=nemoclaw-hermes \
            --cache-to type=gha,mode=max,scope=nemoclaw-hermes \
            -t "${IMAGE}:nightly" \
            -t "${IMAGE}:${DATE}" \
            -t "${IMAGE}:sha-${SHORT}" \
            -t "${IMAGE}:kubevirt" \
            -f agents/hermes/Dockerfile \
            .

      - name: Capture image digest
        id: capture
        if: always()
        env:
          IMAGE: "${{ env.REGISTRY }}/nemoclaw-hermes"
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          set -euo pipefail
          CRANE_BIN="$(mktemp -d)/crane"
          curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/crane_linux_amd64" -o "$CRANE_BIN"
          chmod +x "$CRANE_BIN"
          DIGEST="" 
          for tag in "${DATE}" nightly kubevirt; do
            DIGEST=$($CRANE_BIN digest "${IMAGE}:${tag}" 2>/dev/null) || true
            if [[ -n "$DIGEST" ]]; then
              break
            fi
          done
          if [[ -z "${DIGEST:-}" ]]; then
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:kubevirt" \
              2>/dev/null | awk '/^Digest:/ { print $2; exit }') || true
          fi
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          if [[ -n "${DIGEST:-}" ]]; then
            echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=${IMAGE}:kubevirt" >> "$GITHUB_OUTPUT"
          fi

  build-hermes-bootc:
    needs: [meta, rebases, build-openshell-supervisor, build-nemoclaw-hermes]
    # NemoClaw variant → hermes-sandbox-bootc (public nemoclaw guest).
    if: |
      always() &&
      !cancelled() &&
      needs.meta.result == 'success' &&
      needs.rebases.result == 'success' &&
      (
        needs.meta.outputs.build_hermes == 'true' ||
        needs.meta.outputs.push_images == 'true' &&
        needs.build-openshell-supervisor.result == 'success' &&
        needs.build-nemoclaw-hermes.result == 'success' ||
        needs.meta.outputs.push_images != 'true' &&
        needs.meta.outputs.build_hermes != 'true'
      )
    outputs:
      image_ref: ${{ steps.capture.outputs.image_ref }}
      image_digest: ${{ steps.capture.outputs.image_digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Use existing hermes-sandbox-bootc:nightly
        if: needs.meta.outputs.push_images != 'true' && needs.meta.outputs.build_hermes != 'true'
        run: echo "Skipping nemoclaw bootc rebuild; containerDisk will pull existing :nightly"

      - uses: actions/checkout@v4
        if: needs.meta.outputs.push_images == 'true' || needs.meta.outputs.build_hermes == 'true'

      - uses: docker/setup-buildx-action@v3
        if: needs.meta.outputs.push_images == 'true' || needs.meta.outputs.build_hermes == 'true'
        with:
          version: latest

      - uses: docker/login-action@v3
        if: needs.meta.outputs.push_images == 'true' || needs.meta.outputs.build_hermes == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare context and build hermes-sandbox-bootc (nemoclaw)
        if: needs.meta.outputs.push_images == 'true' || needs.meta.outputs.build_hermes == 'true'
        env:
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short HEAD)
          CTX=images/hermes
          cd "$CTX"

          # Gitignored locally; CI uses the example + empty CA bundle.
          cp -f hermes.env.example hermes.env
          : > extra-ca-certs.pem

          # Containerfile hardcodes localhost for nemoclaw; rewrite for GHCR/buildx.
          sed -i "s|FROM localhost/nemoclaw-hermes:kubevirt|FROM ${REGISTRY}/nemoclaw-hermes:nightly|" \
            Containerfile.nemoclaw

          IMAGE="${REGISTRY}/hermes-sandbox-bootc"
          docker buildx build \
            --platform=linux/amd64 \
            --push \
            --cache-from type=gha,scope=hermes-sandbox-bootc \
            --cache-to type=gha,mode=max,scope=hermes-sandbox-bootc \
            --build-arg "OPENSHELL_SUPERVISOR_IMAGE=${REGISTRY}/openshell-supervisor:nightly" \
            -t "${IMAGE}:nightly" \
            -t "${IMAGE}:${DATE}" \
            -t "${IMAGE}:sha-${SHORT}" \
            -f Containerfile.nemoclaw \
            .

      - name: Capture image digest
        id: capture
        if: always()
        env:
          IMAGE: "${{ env.REGISTRY }}/hermes-sandbox-bootc"
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          set -euo pipefail
          CRANE_BIN="$(mktemp -d)/crane"
          curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/crane_linux_amd64" -o "$CRANE_BIN"
          chmod +x "$CRANE_BIN"
          DIGEST="" 
          for tag in "${DATE}" nightly; do
            DIGEST=$($CRANE_BIN digest "${IMAGE}:${tag}" 2>/dev/null) || true
            if [[ -n "$DIGEST" ]]; then
              break
            fi
          done
          if [[ -z "${DIGEST:-}" ]]; then
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:nightly" \
              2>/dev/null | awk '/^Digest:/ { print $2; exit }') || true
          fi
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          if [[ -n "${DIGEST:-}" ]]; then
            echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=${IMAGE}:nightly" >> "$GITHUB_OUTPUT"
          fi


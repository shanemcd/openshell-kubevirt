          chmod +x "$CRANE_BIN"
          DIGEST="" 
          for tag in "${DATE}" nightly; do
            DIGEST=$($CRANE_BIN digest "${IMAGE}:${tag}" 2>/dev/null) || true
            if [[ -n "$DIGEST" ]]; then
              break
            fi
          done
          if [[ -z "${DIGEST:-}" ]]; then
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:nightly" \
              2>/dev/null | awk '/^Digest:/ { print $2; exit }') || true
          fi
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          if [[ -n "${DIGEST:-}" ]]; then
            echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=${IMAGE}:nightly" >> "$GITHUB_OUTPUT"
          fi

